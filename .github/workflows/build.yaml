# Build both images natively on arm64, push to GHCR, then point the GitOps manifests at
# the new tag. ArgoCD picks up that commit; CI never talks to the clusters.
name: build

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: write   # commit the tag bump
  packages: write   # push to GHCR

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        app: [ingest-api, transcription-worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Bump image tags in gitops/
        run: |
          for app in ingest-api transcription-worker; do
            sed -i -E "s|(ghcr.io/${GITHUB_REPOSITORY}/${app}):[A-Za-z0-9._-]+|\1:${GITHUB_SHA}|" gitops/workloads/*/*.yaml
          done
          git diff --stat
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA::7}" || exit 0
          git pull --rebase
          git push
