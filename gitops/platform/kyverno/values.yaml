# Single-node demo clusters: one replica per controller.
admissionController:
  replicas: 1
backgroundController:
  replicas: 1
cleanupController:
  replicas: 1
reportsController:
  replicas: 1

# The kyverno-api CRDs otherwise render `labels: {}` / `annotations: {}`, which ArgoCD
# reports as permanent OutOfSync. Non-empty values make the desired state match live.
kyverno-api:
  labels:
    app.kubernetes.io/part-of: kyverno
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
