# k3s runs these inside the k3s binary; scraping them only produces "target down" alerts.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }

prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up every ServiceMonitor/PodMonitor/PrometheusRule, not only ones labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # The edge cluster remote-writes its metrics here.
    enableRemoteWriteReceiver: true
  # Reachable from the edge cluster at k3d-cloud-server-0:30090 over the shared network.
  service:
    type: NodePort
    nodePort: 30090

grafana:
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc:3100
