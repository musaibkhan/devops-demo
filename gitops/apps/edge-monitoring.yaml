apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/musaibkhan/devops-demo.git
      targetRevision: main
      ref: values
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.35.0
      helm:
        releaseName: prometheus
        valueFiles: [$values/gitops/platform/monitoring/edge-prometheus-values.yaml]
  destination:
    name: edge
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
    syncOptions: [CreateNamespace=true]
