# Deploys shared namespaces (and the mesh mTLS policy) to EVERY registered cluster.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-namespaces
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters: {}
  template:
    metadata:
      name: '{{.name}}-namespaces'
    spec:
      project: default
      source:
        repoURL: https://github.com/musaibkhan/devops-demo.git
        targetRevision: main
        path: gitops/platform/namespaces
      destination:
        server: '{{.server}}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
        # PeerAuthentication needs Istio's CRDs; retry until the istio app has installed them.
        syncOptions: [SkipDryRunOnMissingResource=true]
