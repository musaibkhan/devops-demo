# Strimzi operator on every cluster; it manages Kafka resources in the "kafka" namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: strimzi
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters: {}
  template:
    metadata:
      name: '{{.name}}-strimzi'
    spec:
      project: default
      source:
        repoURL: https://strimzi.io/charts/
        chart: strimzi-kafka-operator
        targetRevision: 1.2.0
        helm:
          releaseName: strimzi
      destination:
        server: '{{.server}}'
        namespace: kafka
      # The chart's CRD contains an empty `properties: {}` that the API server drops on
      # storage, which ArgoCD would otherwise report as permanent OutOfSync.
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: kafkas.kafka.strimzi.io
          jqPathExpressions:
            - .spec.versions[].schema.openAPIV3Schema.properties.status.properties.clusterSecurity.properties
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
