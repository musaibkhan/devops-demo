# Observability hub: cloud cluster only. Edge metrics are remote-written here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-monitoring
  namespace: argocd
spec:
  project: default
  sources:
    # Values files for the charts below, plus the Grafana dashboards.
    - repoURL: https://github.com/musaibkhan/devops-demo.git
      targetRevision: main
      ref: values
      path: gitops/platform/monitoring/dashboards
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles: [$values/gitops/platform/monitoring/kube-prometheus-stack-values.yaml]
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        valueFiles: [$values/gitops/platform/monitoring/loki-values.yaml]
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        releaseName: alloy
        valueFiles: [$values/gitops/platform/monitoring/alloy-values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
    # ServerSideApply: the Prometheus Operator CRDs are too large for client-side apply.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
