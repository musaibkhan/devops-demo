# Kyverno + our policies on every cluster.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters: {}
  template:
    metadata:
      name: '{{.name}}-kyverno'
    spec:
      project: default
      sources:
        - repoURL: https://github.com/musaibkhan/devops-demo.git
          targetRevision: main
          ref: values
          path: gitops/platform/kyverno-policies
        - repoURL: https://kyverno.github.io/kyverno/
          chart: kyverno
          targetRevision: 3.9.1
          helm:
            releaseName: kyverno
            valueFiles: [$values/gitops/platform/kyverno/values.yaml]
      destination:
        server: '{{.server}}'
        namespace: kyverno
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
        # Policies are applied before their CRDs exist on the first sync; retry covers it.
        syncOptions: [CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true]
